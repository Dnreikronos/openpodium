[package]
name = "openpodium"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A free, open-source canvas for orchestrating coding agents"
license = "Apache-2.0"
repository = "https://github.com/Dnreikronos/openpodium"

[dependencies]
alacritty_terminal = { version = "0.26.0", default-features = false }
blake3 = "1.8.2"
dunce = "1.0.5"
getrandom = "0.3.3"
iced = { version = "0.14.0", features = ["advanced", "canvas", "highlighter", "image-without-codecs", "markdown", "tokio"] }
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
notify-rust = "=4.18.0"
portable-pty = "0.9.0"
rusqlite = { version = "0.37.0", features = ["backup", "bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tempfile = "3.21.0"
tokio = { version = "1.47.1", features = ["sync"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.175"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading"] }

[dev-dependencies]
tokio = { version = "1.47.1", features = ["macros", "rt", "sync", "time"] }
