[package]
name = "openpodium"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A free, open-source canvas for orchestrating coding agents"
license = "Apache-2.0"
repository = "https://github.com/Dnreikronos/openpodium"

[dependencies]
blake3 = "1.8.2"
iced = { version = "0.14.0", features = ["canvas"] }
portable-pty = "0.9.0"
rusqlite = { version = "0.37.0", features = ["backup", "bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tokio = { version = "1.47.1", features = ["sync"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.175"

[dev-dependencies]
tempfile = "3.21.0"
tokio = { version = "1.47.1", features = ["macros", "rt", "sync", "time"] }
