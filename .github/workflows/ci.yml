name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component clippy --component rustfmt

      - name: Show the active Rust toolchain
        run: rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run automated accessibility checks
        run: |
          cargo test --locked --lib accessibility::
          cargo test --locked --lib localization::
          cargo test --locked --lib presentation::
          cargo test --locked --bin openpodium accessibility_

      - name: Run tests
        run: cargo test --all-targets --all-features --locked
